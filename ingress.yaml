apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: road-ingress
  namespace: road-safety
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: road-frontend
            port:
              number: 80
